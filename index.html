<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jummah Mubarak Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to top, #020111 0%, #191621 100%);
      font-family: 'Segoe UI', sans-serif;
    }

    .jummah-text {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 3rem;
      text-align: center;
      text-shadow: 0 0 20px #00f7ff, 0 0 30px #ff00c8;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00f7ff, 0 0 20px #ff00c8;
      }
      to {
        text-shadow: 0 0 30px #00f7ff, 0 0 40px #ff00c8;
      }
    }

    .lantern {
      position: absolute;
      width: 40px;
      height: 60px;
      background: radial-gradient(circle, #f1c40f 20%, #e67e22 80%);
      border-radius: 10% 10% 50% 50%;
      box-shadow: 0 0 20px #f39c12;
      animation: floatLantern 10s linear infinite;
    }

    @keyframes floatLantern {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-200px) rotate(360deg);
        opacity: 0;
      }
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="jummah-text">🌙 Jummah Mubarak 🌙</div>


  <script>
    for (let i = 0; i < 15; i++) {
      let lantern = document.createElement('div');
      lantern.className = 'lantern';
      lantern.style.left = Math.random() * window.innerWidth + 'px';
      lantern.style.animationDelay = Math.random() * 10 + 's';
      lantern.style.width = 30 + Math.random() * 20 + 'px';
      lantern.style.height = 50 + Math.random() * 30 + 'px';
      document.body.appendChild(lantern);
    }

    
    for (let i = 0; i < 100; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(star);
    }
  </script>
</body>
</html>
